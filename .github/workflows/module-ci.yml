name: module-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Trunk-based a main, pero todo cambio entra por rama feature/fix -
      # nunca un push directo a main (eso ya lo bloquea branch protection,
      # esto valida la convención de nombre).
      - name: Validar convención de nombre de rama
        run: |
          head="${{ github.head_ref }}"
          if [[ ! "$head" =~ ^(feature|fix)/.+ ]]; then
            echo "PR hacia main debe venir de feature/* o fix/* (rama: '$head')." >&2
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fmt-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate (por módulo)
        run: |
          for dir in modules/*/; do
            echo "== $dir =="
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      # "examples/" es la prueba de integración de cada módulo: valida que
      # las variables/tipos declarados en el ejemplo realmente encajan con
      # la interfaz del módulo. No hace falta backend ni credenciales AWS
      # -"validate" no habla con la nube, solo revisa la config localmente.
      - name: terraform validate (examples, prueba de integración por módulo)
        run: |
          for dir in examples/*/; do
            echo "== $dir =="
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  tflint:
    runs-on: ubuntu-latest
    needs: fmt-validate
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint init
        run: tflint --init

      - name: tflint (por módulo)
        run: |
          for dir in modules/*/; do
            echo "== $dir =="
            tflint --chdir="$dir"
          done

  security-scan:
    runs-on: ubuntu-latest
    needs: fmt-validate
    steps:
      - uses: actions/checkout@v4

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: modules
          soft_fail: false

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules
          config_file: .checkov.yaml
          quiet: true
          soft_fail: false

  tag-release:
    runs-on: ubuntu-latest
    needs: [tflint, security-scan]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirmar que el tag corresponde a un commit en main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
