name: module-ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"

jobs:
  # El título del PR es el mensaje que queda en "main" tras el squash-merge
  # (squash_merge_commit_title=PR_TITLE a nivel de repo) y es lo que lee
  # @semantic-release/commit-analyzer en el job "release" más abajo.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Trunk-based a main, pero todo cambio entra por rama feature/fix -
      # nunca un push directo a main (eso ya lo bloquea branch protection,
      # esto valida la convención de nombre).
      - name: Validar convención de nombre de rama
        run: |
          head="${{ github.head_ref }}"
          if [[ ! "$head" =~ ^(feature|fix)/.+ ]]; then
            echo "PR hacia main debe venir de feature/* o fix/* (rama: '$head')." >&2
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fmt-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate (por módulo)
        run: |
          for dir in modules/*/; do
            echo "== $dir =="
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      # "examples/" es la prueba de integración de cada módulo: valida que
      # las variables/tipos declarados en el ejemplo realmente encajan con
      # la interfaz del módulo. No hace falta backend ni credenciales AWS
      # -"validate" no habla con la nube, solo revisa la config localmente.
      - name: terraform validate (examples, prueba de integración por módulo)
        run: |
          for dir in examples/*/; do
            echo "== $dir =="
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  tflint:
    runs-on: ubuntu-latest
    needs: fmt-validate
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint init
        run: tflint --init

      - name: tflint (por módulo)
        run: |
          for dir in modules/*/; do
            echo "== $dir =="
            tflint --chdir="$dir"
          done

  security-scan:
    runs-on: ubuntu-latest
    needs: fmt-validate
    steps:
      - uses: actions/checkout@v4

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: modules
          soft_fail: false

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules
          config_file: .checkov.yaml
          quiet: true
          soft_fail: false

  # semantic-release corre en push a main (no en pull_request: se niega a
  # publicar si detecta ese evento) y lee Conventional Commits desde el
  # último tag alcanzable -no solo el commit del push- para crear y empujar
  # el tag vX.Y.Z. Reemplaza el tag manual que antes creaba una persona.
  release:
    runs-on: ubuntu-latest
    needs: [tflint, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: daviplata-ci
          GIT_AUTHOR_EMAIL: ci@daviplata.local
          GIT_COMMITTER_NAME: daviplata-ci
          GIT_COMMITTER_EMAIL: ci@daviplata.local
